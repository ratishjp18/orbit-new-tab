<!DOCTYPE html>
<html lang="en" data-anim-speed="normal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Layer 0: animated starfield -->
  <canvas id="starfield" aria-hidden="true"></canvas>

  <!-- Layer 1: drifting nebula clouds -->
  <div class="nebula-layer" aria-hidden="true">
    <div class="nebula nebula--1"></div>
    <div class="nebula nebula--2"></div>
    <div class="nebula nebula--3"></div>
    <div class="nebula nebula--4"></div>
  </div>

  <!-- Layer 1: faint corner planet -->
  <div class="planet" aria-hidden="true"></div>

  <!-- Layer 2: app tiles -->
  <main class="main">
    <div id="tiles-grid" class="tiles-grid tiles-grid--large" role="list"></div>
  </main>

  <!-- Settings toggle (hidden until hover) -->
  <button id="settings-toggle" class="settings-toggle" aria-label="Open settings" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06
               a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09
               A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83
               l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09
               A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83
               l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09
               a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83
               l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09
               a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>

  <!-- Settings panel -->
  <aside id="settings-panel" class="settings-panel" role="dialog" aria-label="Settings" aria-modal="true">
    <div class="settings-header">
      <h2>Settings</h2>
      <button id="settings-close" class="settings-close" aria-label="Close settings">&#x2715;</button>
    </div>

    <div class="settings-body">

      <!-- Tile size -->
      <section class="settings-section">
        <h3>Tile Size</h3>
        <div class="btn-group">
          <button class="size-btn" data-size="medium">Medium</button>
          <button class="size-btn active" data-size="large">Large</button>
          <button class="size-btn" data-size="xlarge">X-Large</button>
        </div>
      </section>

      <!-- Animation speed -->
      <section class="settings-section">
        <h3>Animation</h3>
        <div class="btn-group">
          <button class="speed-btn" data-speed="slow">Slow</button>
          <button class="speed-btn active" data-speed="normal">Normal</button>
          <button class="speed-btn" data-speed="off">Off</button>
        </div>
      </section>

      <!-- Edit mode -->
      <section class="settings-section">
        <h3>Tiles</h3>
        <button id="edit-mode-toggle" class="btn-primary">Edit Tiles</button>
      </section>

      <!-- Add app -->
      <section class="settings-section">
        <h3>Add App</h3>
        <form id="add-app-form" class="add-app-form" novalidate>
          <input type="text"  id="new-app-name"  placeholder="App name"             required>
          <input type="url"   id="new-app-url"   placeholder="https://example.com"  required>
          <div class="add-app-row">
            <label for="new-app-color">Glow colour</label>
            <input type="color" id="new-app-color" value="#8b5cf6">
          </div>
          <button type="submit" class="btn-primary">Add App</button>
        </form>
      </section>

      <!-- Reset -->
      <section class="settings-section">
        <button id="reset-btn" class="btn-danger">Reset to Defaults</button>
      </section>

    </div>
  </aside>

  <script src="js/stars.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
