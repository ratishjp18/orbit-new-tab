<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="#07000f"/>

  <!-- Orbit ring (ellipse) -->
  <ellipse cx="64" cy="64" rx="50" ry="20"
           fill="none" stroke="#8b5cf6" stroke-width="3.5" opacity="0.75"/>

  <!-- Planet body -->
  <circle cx="64" cy="64" r="22" fill="#4c1d95"/>
  <circle cx="64" cy="64" r="22"
          fill="url(#planetShine)" opacity="0.8"/>

  <!-- Planet surface highlight -->
  <ellipse cx="58" cy="57" rx="10" ry="7"
           fill="rgba(167,139,250,0.25)" transform="rotate(-20 58 57)"/>

  <!-- Small moon on the orbit -->
  <circle cx="114" cy="64" r="5" fill="#c4b5fd"/>

  <!-- Stars -->
  <circle cx="18"  cy="16"  r="1.8" fill="white" opacity="0.9"/>
  <circle cx="108" cy="22"  r="1.4" fill="white" opacity="0.7"/>
  <circle cx="22"  cy="100" r="1.6" fill="white" opacity="0.8"/>
  <circle cx="102" cy="106" r="1.2" fill="white" opacity="0.6"/>
  <circle cx="14"  cy="58"  r="1.0" fill="white" opacity="0.5"/>
  <circle cx="112" cy="50"  r="1.0" fill="white" opacity="0.5"/>

  <defs>
    <radialGradient id="planetShine" cx="38%" cy="36%" r="65%">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#4c1d95" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1e0050" stop-opacity="1"/>
    </radialGradient>
  </defs>
</svg>
