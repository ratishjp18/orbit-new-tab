<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="strBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fc4c02"/>
      <stop offset="100%" stop-color="#e03400"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="22" fill="url(#strBg)"/>

  <!--
    Strava chevron mark:
    Left leg (lighter) + right leg (white)
    The logo is essentially two chevron strokes forming a bold "S"-like shape
  -->

  <!-- Left chevron leg -->
  <polygon
    points="36,28 58,28 74,72 52,72"
    fill="rgba(255,255,255,0.55)"
  />

  <!-- Right chevron leg (white, starts at the midpoint) -->
  <polygon
    points="52,72 74,72 90,28 68,28"
    fill="white"
  />

  <!-- Bottom left continuation -->
  <polygon
    points="52,72 62,100 74,72"
    fill="white"
    opacity="0.7"
  />
  <polygon
    points="74,72 86,100 96,72 74,72"
    fill="white"
  />
</svg>
