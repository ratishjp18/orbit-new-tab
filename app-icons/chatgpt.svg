<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Soft teal glow -->
    <radialGradient id="cgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#10a37f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10a37f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="22" fill="#202123"/>

  <!-- Subtle glow -->
  <circle cx="64" cy="64" r="52" fill="url(#cgGlow)"/>

  <!--
    Simplified OpenAI / ChatGPT mark:
    two interlocking rounded hexagons rotated 30° from each other,
    drawn as stroked arcs to keep it light and clean.
  -->
  <!-- Outer ring -->
  <circle cx="64" cy="64" r="34" fill="none" stroke="#10a37f" stroke-width="5" opacity="0.9"/>

  <!-- Inner petal shapes (6-pointed flower) -->
  <g stroke="#10a37f" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.75">
    <!-- 3 crossing chords that form the OpenAI-style mark -->
    <line x1="64" y1="30" x2="64" y2="98"/>
    <line x1="35" y1="47" x2="93" y2="81"/>
    <line x1="35" y1="81" x2="93" y2="47"/>
  </g>

  <!-- Centre dot -->
  <circle cx="64" cy="64" r="7" fill="#10a37f"/>
</svg>
