<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="dBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#c026d3"/>
      <stop offset="45%"  stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="22" fill="url(#dBg)"/>

  <!-- Subtle rotated square shapes in background -->
  <rect x="54" y="54" width="72" height="72" rx="6"
        fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="3"
        transform="rotate(18 90 90)"/>
  <rect x="44" y="44" width="90" height="90" rx="6"
        fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="3"
        transform="rotate(18 89 89)"/>

  <!-- "district" — bold chunky lowercase -->
  <text
    x="64" y="70"
    text-anchor="middle"
    font-family="'Arial Black', 'Arial Rounded MT Bold', Impact, sans-serif"
    font-size="26"
    font-weight="900"
    fill="white"
    letter-spacing="-0.5"
  >district</text>

  <!-- "BY ZOMATO" — small spaced subtitle -->
  <text
    x="64" y="86"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="9.5"
    font-weight="700"
    fill="rgba(255,255,255,0.88)"
    letter-spacing="2"
  >BY ZOMATO</text>
</svg>
