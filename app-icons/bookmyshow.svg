<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Red background -->
  <rect width="128" height="128" rx="22" fill="#f01436"/>

  <!--
    Fan of tickets rotating around the notch pivot (58, 106).
    Each ticket: rounded rect, semicircle notch cut at bottom.
    Back tickets are slightly transparent so the fan reads clearly.
  -->

  <!-- Ticket shape:
       Top-left (28,16) → top-right (88,16) → down right side
       → bottom-right rounded corner → across to notch right (68,106)
       → NOTCH arc upward → notch left (48,106)
       → across to bottom-left rounded corner → up left side → close
  -->

  <!-- Ticket 4 — most behind, most rotated -->
  <path
    transform="rotate(24, 58, 106)"
    fill="rgba(255,255,255,0.45)"
    d="M 34 16 L 82 16 Q 88 16 88 22
       L 88 100 Q 88 106 82 106
       L 68 106 A 10 10 0 0 0 48 106
       L 34 106 Q 28 106 28 100
       L 28 22 Q 28 16 34 16 Z"
  />

  <!-- Ticket 3 -->
  <path
    transform="rotate(16, 58, 106)"
    fill="rgba(255,255,255,0.62)"
    d="M 34 16 L 82 16 Q 88 16 88 22
       L 88 100 Q 88 106 82 106
       L 68 106 A 10 10 0 0 0 48 106
       L 34 106 Q 28 106 28 100
       L 28 22 Q 28 16 34 16 Z"
  />

  <!-- Ticket 2 -->
  <path
    transform="rotate(8, 58, 106)"
    fill="rgba(255,255,255,0.80)"
    d="M 34 16 L 82 16 Q 88 16 88 22
       L 88 100 Q 88 106 82 106
       L 68 106 A 10 10 0 0 0 48 106
       L 34 106 Q 28 106 28 100
       L 28 22 Q 28 16 34 16 Z"
  />

  <!-- Front ticket — full white -->
  <path
    fill="white"
    d="M 34 16 L 82 16 Q 88 16 88 22
       L 88 100 Q 88 106 82 106
       L 68 106 A 10 10 0 0 0 48 106
       L 34 106 Q 28 106 28 100
       L 28 22 Q 28 16 34 16 Z"
  />

  <!-- "my" text in brand red, bold rounded font -->
  <text
    x="58" y="82"
    text-anchor="middle"
    font-family="'Arial Rounded MT Bold', 'Nunito', 'Arial Black', Arial, sans-serif"
    font-size="40"
    font-weight="900"
    fill="#f01436"
  >my</text>
</svg>
